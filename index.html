<!DOCTYPE html>
<html>
<head>
<title>The Digital Observatory</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Digital Observatory</title>

    <!-- CSS -->

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/threshold.css">
    <link rel="stylesheet" href="css/mission-control.css">
    <link rel="stylesheet" href="css/polaris.css">
    <link rel="stylesheet" href="css/telescope.css">
    <link rel="stylesheet" href="css/universe.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/polaris.js"></script>
    <script src="js/constellation.js"></script>
    <script src="js/animations.js"></script>

</head>
<body>
    <section id="threshold"> <!-- This is the threshold part -->
        <div class="signal"></div>
        <div class="transmission">
            <p class="transmission-log"></p>
            <div class="connection-progress">
                <div class="progress-bar"></div>
            </div>        
        </div>    
    </section>
    <main>  <!-- This is the main observatory part -->
        <section id="mission-control">
            <h2>MISSION CONTROL</h2>
            <section id="polaris">
                <div class="representation">

                </div>
                <h3> POLARIS </h3>
                <div class="identity">
                </div>
                <div class="status">
                    <p> ONLINE </p>                
                </div>
                <div class="briefing">
                    <p>
                        Welcome, Observer.
                        The observatory is online and awaiting for your first observaion.
                    </p>
                </div>
                <div class="guidance">
                    <p>
                        Turn the telescope toward a constellation to begin your first observation.
                    </p>
                </div>
                
            </section>
            <section id="telescope">
                <h2> OBSERVATION TELESCOPE</h2>
                <div id="telescope-body">
                    <div id="lens">
                        <div id="universe">
                            <div id="star-field">

                            </div>
                            <div id="constellations">
                                <section id="research-constellation">
                                    <div class="star-pattern">

                                    </div>
                                    

                                    <section id="research-station">

                                    </section>

                                </section>
                                <section id="archive-constellation">
                                    <div class="star-pattern"></div>
                                    <section id="archive-station">

                                    </section>
                                </section>
                                <section id="systems-constellation">
                                    <div class="star-pattern"></div>
                                    <section id="systems-station">
                                    </section>
                                </section>
                                <section id="observation-constellation">
                                    <div class="star-pattern"></div>
                                    <section id="observation-station">
                                    </section>              
                                </section>  
                                <section id="communications-constellation"> 
                                    <div class="star-pattern"></div>
                                    <section id="communications-station">
                                </section>  

                        </div>
                    </div>
                    <div id="telescope-status">
                        <p> Awaiting alignment..</p>

                    </div> 
                    <div id="observation-instruction">
                        <p>
                            Rotate the telescope to begin observing.
                        </p>
                    </div>
                </div>
            </section>
            
        </section>
    </main>
</body>
</html>
